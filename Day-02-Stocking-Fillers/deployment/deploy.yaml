# =============================================================================
# CloudLabs | Fast Lane - 12 Days of AI Agents: The Christmas Change Freeze
# Track A: Developer | Day 2: Stocking Fillers (Challenge)
# One deployment per learner project. Creates only the basic resources:
#   clgvpc / clgsubnet (CloudLabs standard names, needed for web RDP), RDP firewall,
#   hollyfield-workbench bucket (Holly's code + build staging),
#   hollyfield-builder (Cloud Build identity), core-banking-sa (Cloud Run runtime identity),
#   labvm (Windows workstation)
# The mock core-banking API (Cloud Run) is built and deployed by the
# "Prepare Hollyfield" validation step (runs as CloudLabs System).
# Region: us-central1 (template Zones = us-central1-a / -b / -c)
# =============================================================================
resources:
  - name: clgvpc-@deploymentId
    type: compute.v1.network
    properties:
      autoCreateSubnetworks: false

  - name: clgsubnet-@deploymentId
    type: compute.v1.subnetwork
    properties:
      network: $(ref.clgvpc-@deploymentId.selfLink)
      ipCidrRange: 10.1.0.0/24
      region: @region

  - name: allow-rdp-@deploymentId
    type: compute.v1.firewall
    properties:
      network: $(ref.clgvpc-@deploymentId.selfLink)
      sourceRanges: ['0.0.0.0/0']
      allowed:
      - IPProtocol: tcp
        ports: [3389]
      targetTags: ['rdp']

  # --- Hollyfield workbench: Holly's code (Challenge 5) and build staging -------
  - name: hollyfield-workbench-@deploymentId
    type: storage.v1.bucket
    properties:
      location: @region
      storageClass: STANDARD
      iamConfiguration:
        uniformBucketLevelAccess:
          enabled: true
      lifecycle:
        rule:
        - action:
            type: Delete
          condition:
            age: 30

  # --- Identities ------------------------------------------------------------------
  - name: hollyfield-builder
    type: iam.v1.serviceAccount
    properties:
      accountId: hollyfield-builder
      displayName: Hollyfield - builds and deploys the core-banking API

  - name: core-banking-sa
    type: iam.v1.serviceAccount
    properties:
      accountId: core-banking-sa
      displayName: Hollyfield core-banking API runtime (no project roles)

  # --- Learner workstation (web-based RDP) -----------------------------------------
  - name: labvm-@deploymentId
    type: compute.v1.instance
    properties:
      zone: @zone
      machineType: zones/@zone/machineTypes/e2-standard-2
      disks:
      - deviceName: boot
        type: PERSISTENT
        boot: true
        autoDelete: true
        initializeParams:
          sourceImage: projects/windows-cloud/global/images/windows-server-2022-dc-v20251112
          diskSizeGb: 50
      networkInterfaces:
      - network: $(ref.clgvpc-@deploymentId.selfLink)
        subnetwork: $(ref.clgsubnet-@deploymentId.selfLink)
        accessConfigs:
        - name: External NAT
          type: ONE_TO_ONE_NAT
      tags:
        items: ['rdp']
      metadata:
        items:
        - key: windows-startup-script-ps1
          value: |
              $userName = "Labuser"
              $password = ConvertTo-SecureString "Password.1!!" -AsPlainText -Force
              if (-not (Get-LocalUser -Name $userName -ErrorAction SilentlyContinue)) {
                New-LocalUser -Name $userName -Password $password -PasswordNeverExpires -UserMayNotChangePassword -AccountNeverExpires
                Add-LocalGroupMember -Group "Administrators" -Member $userName
              }
              # Desktop shortcuts for every user
              $desk = "C:\Users\Public\Desktop"
              $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
              if (-not (Test-Path $edge)) { $edge = "C:\Program Files\Microsoft\Edge\Application\msedge.exe" }
              $ws = New-Object -ComObject WScript.Shell
              foreach ($pair in "Google Cloud Console|https://console.cloud.google.com", "Google Cloud Shell|https://shell.cloud.google.com") {
                $name = $pair.Split("|")[0]
                $url  = $pair.Split("|")[1]
                if (Test-Path $edge) {
                  $s = $ws.CreateShortcut($desk + "\" + $name + ".lnk")
                  $s.TargetPath = $edge
                  $s.Arguments = $url
                  $s.IconLocation = $edge + ",0"
                  $s.Save()
                } else {
                  Set-Content -Path ($desk + "\" + $name + ".url") -Value ("[InternetShortcut]`r`nURL=" + $url)
                }
              }
              # Edge: skip the first-run wizard
              $pol = "HKLM:\SOFTWARE\Policies\Microsoft\Edge"
              New-Item -Path $pol -Force | Out-Null
              New-ItemProperty -Path $pol -Name HideFirstRunExperience -Value 1 -PropertyType DWord -Force | Out-Null
              Get-ScheduledTask -TaskName ServerManager -ErrorAction SilentlyContinue | Disable-ScheduledTask | Out-Null

outputs:
  - name: vpcName
    value: $(ref.clgvpc-@deploymentId.name)

  - name: vpcId
    value: $(ref.clgvpc-@deploymentId.id)

  - name: subnetName
    value: $(ref.clgsubnet-@deploymentId.name)

  - name: subnetId
    value: $(ref.clgsubnet-@deploymentId.id)

  - name: vmPublicIp
    value: $(ref.labvm-@deploymentId.networkInterfaces[0].accessConfigs[0].natIP)

  - name: vmPrivateIp
    value: $(ref.labvm-@deploymentId.networkInterfaces[0].networkIP)

  - name: vmUsername
    value: "Labuser"

  - name: vmPassword
    value: "Password.1!!"

  # --- Lab guide inject keys ---------------------------------------------------
  - name: ProjectId
    value: $(ref.core-banking-sa.projectId)

  - name: Region
    value: @region

  - name: WorkbenchBucket
    value: $(ref.hollyfield-workbench-@deploymentId.name)

  - name: CoreBankingService
    value: hollyfield-core-banking
